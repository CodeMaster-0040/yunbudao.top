<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语不道 QQ 频道</title>
<link rel="stylesheet" href="style.css">
<style>
  .qq-card {
    max-width: 460px;
    margin: 80px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .qq-logo {
    width: 72px; height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, #12b7f5, #0a84ff);
    display: grid; place-items: center;
    margin: 0 auto 20px;
    font-size: 34px; color: #fff;
  }
  .qq-card h1 { font-size: 22px; margin-bottom: 8px; }
  .qq-id {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .qq-desc {
    font-size: 14px;
    color: var(--sub);
    line-height: 1.7;
    margin-bottom: 28px;
  }
  .qq-btn {
    display: inline-block;
    background: linear-gradient(135deg, #4f6ef7, #8b5cf6);
    color: #fff;
    text-decoration: none;
    padding: 13px 40px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    transition: .2s;
    box-shadow: 0 4px 14px rgba(79,110,247,.35);
  }
  .qq-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(79,110,247,.45); }
</style>
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark">语</span>
      <span class="logo-text">语不道</span>
    </a>
  </div>
</header>

<main class="wrap">
  <div class="qq-card">
    <div class="qq-logo">🐧</div>
    <h1>语不道 QQ 频道</h1>
    <div class="qq-id">频道号：pd63695515</div>
    <p class="qq-desc">
      欢迎加入语不道腾讯频道！<br>
      在这里可以交流工具使用、反馈问题、获取网站更新。
    </p>
    <a class="qq-btn" href="https://pd.qq.com/pd63695515" target="_blank" rel="noopener">
      加入频道
    </a>
  </div>
</main>

<footer class="footer">
  <p>© 2026 语不道 · yunbudao.top</p>
</footer>

</body>
</html>
