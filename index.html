<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人小站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f0f12;color:#fff;min-height:100vh}
header{position:sticky;top:0;background:rgba(15,15,18,.85);backdrop-filter:blur(12px);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;z-index:10}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav a{color:#aaa;text-decoration:none;margin-left:16px;font-size:14px;transition:.2s}
nav a:hover{color:#fff}
.hero{padding:80px 20px;text-align:center;background:radial-gradient(circle at top,#1e1b4b,#0f0f12)}
.hero h1{font-size:32px;margin-bottom:12px;line-height:1.2}
.hero p{color:#9ca3af;font-size:15px;max-width:400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:20px}
.card{background:#1a1a1f;border-radius:16px;overflow:hidden;border:1px solid #27272a;transition:.3s ease;cursor:pointer}
.card:hover{transform:translateY(-5px);border-color:#8b5cf6;box-shadow:0 10px 20px -10px rgba(139,92,246,.4)}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card .info{padding:14px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{font-size:12px;color:#71717a;line-height:1.4}
footer{text-align:center;padding:40px;color:#52525b;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">我的小站</div>
  <nav>
    <a href="#">首页</a>
    <a href="#">图集</a>
    <a href="#">关于</a>
  </nav>
</header>

<section class="hero">
  <h1>欢迎来到我的网站</h1>
  <p>用手机亲手写代码、亲手部署，感觉真不错</p>
</section>

<main class="grid">
  <article class="card">
    <img src="https://picsum.photos/400/300?random=1" alt="封面">
    <div class="info"><h3>项目一</h3><p>这是我的第一个作品展示</p></div>
  </article>
  <article class="card">
    <img src="https://picsum.photos/400/300?random=2" alt="封面">
    <div class="info"><h3>项目二</h3><p>这是我的第二个作品展示</p></div>
  </article>
  <article class="card">
    <img src="https://picsum.photos/400/300?random=3" alt="封面">
    <div class="info"><h3>项目三</h3><p>这是我的第三个作品展示</p></div>
  </article>
  <article class="card">
    <img src="https://picsum.photos/400/300?random=4" alt="封面">
    <div class="info"><h3>项目四</h3><p>这是我的第四个作品展示</p></div>
  </article>
</main>

<footer>© 2026 我的个人小站</footer>
</body>
</html>
