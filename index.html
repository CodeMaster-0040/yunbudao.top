<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云不道 · 导航</title>
<meta name="description" content="云不道，精选，好用，在线，工具、APP、接口和网盘资源。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a class="logo" href="/">
      <span class="logo-mark">☁️</span>
      <span class="logo-text">云不道</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="media.html" style="color:var(--sub);text-decoration:none;font-size:14px;">媒体</a>
      <button class="theme-btn" id="themeBtn" aria-label="切换主题">🌙</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="hero-icon">✨</div>
    <h1>云不道 · 导航</h1>
    <p class="hero-sub">精选好用的在线工具、APP、接口和网盘资源</p>

    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="搜索工具、APP、接口或资源…" autocomplete="off">
      <button class="clear-btn" id="clearBtn" hidden aria-label="清空">✕</button>
    </div>
  </section>

  <nav class="cats" id="cats"></nav>

  <section class="grid" id="grid"></section>

  <div class="empty" id="empty" hidden>
    <div class="empty-icon">🔍</div>
    <p>没有找到相关内容</p>
  </div>

</main>

<footer class="footer">
  <p>© 2026 云不道 · yunbudao.top</p>
</footer>

<script src="script.js"></script>
</body>
</html>
