<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语不道 · 视频与图片</title>
<link rel="stylesheet" href="style.css">
<style>
  .media-section { padding: 34px 0; }
  .media-section h2 {
    font-size: 20px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .media-section h2::before {
    content: ""; width: 4px; height: 18px;
    background: var(--accent); border-radius: 2px;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }
  .gallery img {
    width: 100%; height: 160px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform .18s, box-shadow .18s;
    background: var(--card);
  }
  .gallery img:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
  }
  .video-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .video-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .video-item iframe,
  .video-item video {
    width: 100%; aspect-ratio: 16/9;
    display: block; border: 0; background: #000;
  }
  .video-item .video-title {
    padding: 12px 14px;
    font-size: 14px; font-weight: 500;
  }
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.85);
    display: none; place-items: center;
    padding: 24px;
  }
  .lightbox.show { display: grid; }
  .lightbox img {
    max-width: 100%; max-height: 90vh;
    border-radius: 10px;
  }
  .lightbox-close {
    position: absolute; top: 18px; right: 22px;
    font-size: 28px; color: #fff; cursor: pointer;
    background: none; border: 0; line-height: 1;
  }
</style>
</head>
<body>

<header class="header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html">
      <span class="logo-mark">语</span>
      <span class="logo-text">语不道</span>
    </a>
    <a href="index.html" style="color:var(--sub);text-decoration:none;font-size:14px;">← 返回首页</a>
  </div>
</header>

<main class="wrap">
  <section class="media-section">
    <h2>图片</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="media-section">
    <h2>视频</h2>
    <div class="video-list" id="videoList"></div>
  </section>
</main>

<footer class="footer">
  <p>© 2026 语不道 · yunbudao.top</p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
/* ========== 在这里维护你的图片和视频 ========== */

// 图片列表：把链接换成你自己的图片地址
const IMAGES = [
  "https://picsum.photos/seed/1/600/400",
  "https://picsum.photos/seed/2/600/400",
  "https://picsum.photos/seed/3/600/400",
  "https://picsum.photos/seed/4/600/400",
];

// 视频列表：bilibili 填 BV 号；mp4 填直链
const VIDEOS = [
  { type: "bilibili", bvid: "BV1GJ411x7h7", title: "B站示例视频" },
  { type: "mp4", src: "https://www.w3schools.com/html/mov_bbb.mp4", title: "MP4 示例视频" },
];

/* ========== 以下逻辑无需修改 ========== */

document.getElementById('gallery').innerHTML = IMAGES.map(src =>
  `<img src="${src}" loading="lazy" alt="图片">`
).join('');

document.getElementById('videoList').innerHTML = VIDEOS.map(v => {
  if (v.type === 'bilibili') {
    return `
      <div class="video-item">
        <iframe src="//player.bilibili.com/player.html?bvid=${v.bvid}&page=1&high_quality=1"
          scrolling="no" allowfullscreen="true"></iframe>
        <div class="video-title">${v.title}</div>
      </div>`;
  }
  return `
    <div class="video-item">
      <video src="${v.src}" controls preload="metadata"></video>
      <div class="video-title">${v.title}</div>
    </div>`;
}).join('');

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

document.getElementById('gallery').addEventListener('click', e => {
  if (e.target.tagName === 'IMG') {
    lightboxImg.src = e.target.src;
    lightbox.classList.add('show');
  }
});

document.getElementById('lightboxClose').onclick = () => lightbox.classList.remove('show');
lightbox.onclick = e => { if (e.target === lightbox) lightbox.classList.remove('show'); };
</script>

</body>
</html>
